name: nextep-bookstore
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8000"
    environment:
      DJANGO_ENV: development
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: django-insecure-local-docker-demo-only
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://bookstore:local-demo-only@db:5432/bookstore
      LOCAL_CURRENCY: EUR
      DEFAULT_EXCHANGE_RATE: "0.85"
      SECURE_SSL_REDIRECT: "false"
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
