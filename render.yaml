# Requiere una cuenta Render. Revisar disponibilidad y límites del plan Free.
# Recursos nuevos, independientes de cualquier aplicación existente.
services:
  - type: web
    name: nextep-bookstore-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: nextep-bookstore-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: LOCAL_CURRENCY
        value: EUR
      - key: DEFAULT_EXCHANGE_RATE
        value: "0.85"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: RUN_MIGRATIONS
        value: "1"
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
databases:
  - name: nextep-bookstore-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: bookstore
    user: bookstore
    ipAllowList: []
