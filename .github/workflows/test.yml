name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookstore
          POSTGRES_USER: bookstore
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookstore -d bookstore"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bookstore:test-only@localhost:5432/bookstore
      DJANGO_DEBUG: "false"
      LOCAL_CURRENCY: EUR
      DEFAULT_EXCHANGE_RATE: "0.85"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m coverage run --source=books,config manage.py test
      - run: python -m coverage report
      - run: python manage.py spectacular --file schema.generated.yml --validate --fail-on-warn
      - run: docker build -t bookstore-inventory-api .
